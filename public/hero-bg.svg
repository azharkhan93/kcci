<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="100%" height="100%">
  <defs>
    <!-- Rich Background Mesh Gradients -->
    <linearGradient id="bgGradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120626" />
      <stop offset="35%" stop-color="#2d134b" />
      <stop offset="70%" stop-color="#582c83" />
      <stop offset="100%" stop-color="#220b38" />
    </linearGradient>

    <radialGradient id="glowPurple" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8a3ecf" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#120626" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowGold" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#d99b26" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#d99b26" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glassmorphism Glass Tube Fill & Glow -->
    <linearGradient id="glassBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="liquidSoil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d99b26" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="liquidBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="liquidEmerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.95" />
    </linearGradient>

    <!-- Hexagon Pattern -->
    <pattern id="hexPattern" width="40" height="69.282" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 20 11.547 L 0 0 L 0 23.094 L 20 34.641 L 40 23.094 Z M 0 34.641 L 20 46.188 L 0 57.735 L 0 69.282 L 20 69.282 L 40 57.735 L 40 34.641 Z" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.06" />
    </pattern>

    <!-- Drop Shadow Filter for Text & Glassware -->
    <filter id="shadowText" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- 1. Background Fill & Ambient Glows -->
  <rect width="1920" height="600" fill="url(#bgGradMain)" />
  <rect width="1920" height="600" fill="url(#glowPurple)" />
  <rect width="1920" height="600" fill="url(#glowGold)" />

  <!-- 2. Hexagonal Tech Matrix Pattern Overlay -->
  <rect width="1920" height="600" fill="url(#hexPattern)" />

  <!-- 3. Right Side 3D Laboratory Equipment Visuals -->
  <g transform="translate(1220, 50)" opacity="0.8" filter="url(#shadowText)">
    <!-- Molecular Nodes Matrix Graphic Background -->
    <g opacity="0.2" stroke="#f5c253" stroke-width="1.5">
      <line x1="100" y1="100" x2="250" y2="180" />
      <line x1="250" y1="180" x2="380" y2="120" />
      <line x1="250" y1="180" x2="250" y2="320" />
      <line x1="250" y1="320" x2="420" y2="380" />
      <circle cx="100" cy="100" r="8" fill="#f5c253" />
      <circle cx="250" cy="180" r="12" fill="#38bdf8" />
      <circle cx="380" cy="120" r="10" fill="#34d399" />
      <circle cx="250" cy="320" r="10" fill="#f5c253" />
      <circle cx="420" cy="380" r="14" fill="#fbbf24" />
    </g>

    <!-- High-Tech Test Tube Stand Base -->
    <rect x="160" y="380" width="340" height="20" rx="6" fill="url(#goldMetallic)" />
    <rect x="180" y="240" width="300" height="10" rx="4" fill="url(#goldMetallic)" opacity="0.8" />
    <rect x="180" y="250" width="14" height="130" fill="#78350f" />
    <rect x="466" y="250" width="14" height="130" fill="#78350f" />

    <!-- Test Tube 1: Soil Extract -->
    <g transform="translate(210, 110)">
      <rect x="0" y="0" width="36" height="260" rx="18" fill="url(#glassBody)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" />
      <rect x="4" y="120" width="28" height="132" rx="14" fill="url(#liquidSoil)" />
    </g>

    <!-- Test Tube 2: Blue pH Indicator -->
    <g transform="translate(275, 80)">
      <rect x="0" y="0" width="36" height="290" rx="18" fill="url(#glassBody)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" />
      <rect x="4" y="130" width="28" height="152" rx="14" fill="url(#liquidBlue)" />
    </g>

    <!-- Test Tube 3: Emerald Bio Extract -->
    <g transform="translate(340, 130)">
      <rect x="0" y="0" width="36" height="240" rx="18" fill="url(#glassBody)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" />
      <rect x="4" y="100" width="28" height="132" rx="14" fill="url(#liquidEmerald)" />
    </g>

    <!-- Test Tube 4: Gold Nitrogen Indicator -->
    <g transform="translate(405, 100)">
      <rect x="0" y="0" width="36" height="270" rx="18" fill="url(#glassBody)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.6" />
      <rect x="4" y="140" width="28" height="122" rx="14" fill="url(#liquidSoil)" />
    </g>

    <!-- Precision Erlenmeyer Flask (Front Left) -->
    <g transform="translate(40, 160)">
      <path d="M 60,0 L 100,0 L 100,90 L 160,210 A 20,20 0 0,1 142,240 H 18 A 20,20 0 0,1 0,210 L 60,90 Z" fill="url(#glassBody)" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.7" />
      <path d="M 12,205 L 148,205 L 125,160 Q 80,140 35,160 Z" fill="url(#liquidBlue)" />
    </g>
  </g>

  <!-- 4. Left Side Bio-Tech Leaf Motif -->
  <g transform="translate(100, 80)" opacity="0.12">
    <path d="M 0,400 C 150,300 220,120 380,40 C 300,180 220,320 0,400 Z" fill="#ffffff" />
    <path d="M 140,350 C 260,250 360,180 500,120 C 400,220 280,310 140,350 Z" fill="#d99b26" />
  </g>

  <!-- 5. Bright White & High Visibility Typography -->
  <g transform="translate(120, 160)" filter="url(#shadowText)">
    <!-- Gold Division Pill Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="320" height="34" rx="17" fill="url(#goldMetallic)" />
      <text x="160" y="22" fill="#2d134b" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" letter-spacing="2.5" text-anchor="middle">
        DIVISION OF SOIL SCIENCE
      </text>
    </g>

    <!-- BRIGHT WHITE HIGH-VISIBILITY MAIN TITLE -->
    <text x="0" y="95" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" letter-spacing="1.5" opacity="1">
      SKUAST-K SOIL TESTING LABORATORY
    </text>

    <!-- Subtitle / Short Description -->
    <text x="0" y="140" fill="#fef08a" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" letter-spacing="0.5" opacity="0.95">
      Comprehensive Soil, Water, Plant &amp; Fertilizer Testing Services
    </text>

    <text x="0" y="172" fill="#e2d4f0" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="15" opacity="0.85">
      Shalimar Main Campus • Srinagar, Jammu &amp; Kashmir (190025)
    </text>

    <!-- Gold Accent Line -->
    <line x1="0" y1="195" x2="480" y2="195" stroke="url(#goldMetallic)" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
